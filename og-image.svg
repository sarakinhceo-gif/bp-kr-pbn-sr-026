<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1105" cy="183" r="43" fill="#1a1a2e" opacity="0.10"/>
    <circle cx="527" cy="153" r="91" fill="#1a1a2e" opacity="0.12"/>
    <circle cx="253" cy="318" r="53" fill="#1a1a2e" opacity="0.15"/>
    <circle cx="471" cy="568" r="40" fill="#1a1a2e" opacity="0.16"/>
    <circle cx="1221" cy="343" r="63" fill="#1a1a2e" opacity="0.09"/>
    <circle cx="908" cy="278" r="48" fill="#1a1a2e" opacity="0.12"/>
    <rect x="421" y="222" width="94" height="72" rx="8" fill="#0a0a0a" opacity="0.07" transform="rotate(17, 620, 409)"/>
    <rect x="1250" y="414" width="52" height="88" rx="8" fill="#0a0a0a" opacity="0.04" transform="rotate(27, 661, -37)"/>
    <rect x="771" y="-27" width="80" height="38" rx="8" fill="#0a0a0a" opacity="0.08" transform="rotate(34, 1013, 684)"/>
    <rect x="432" y="317" width="45" height="40" rx="8" fill="#0a0a0a" opacity="0.03" transform="rotate(39, 265, 564)"/>
    <rect x="463" y="323" width="85" height="45" rx="8" fill="#0a0a0a" opacity="0.05" transform="rotate(4, 437, -40)"/>
    <rect x="10" y="-40" width="73" height="57" rx="8" fill="#0a0a0a" opacity="0.07" transform="rotate(18, 460, 171)"/>
    <rect x="590" y="185" width="37" height="49" rx="8" fill="#0a0a0a" opacity="0.13" transform="rotate(11, 822, 702)"/>
    <rect x="1049" y="190" width="81" height="82" rx="8" fill="#0a0a0a" opacity="0.06" transform="rotate(38, 660, 721)"/>
    <polygon points="743,484 785,568 701,568" fill="#1a1a2e" opacity="0.04"/>
    <polygon points="1097,-77 1160,49 1034,49" fill="#1a1a2e" opacity="0.13"/>
    <polygon points="-16,651 38,759 -70,759" fill="#1a1a2e" opacity="0.05"/>
    <polygon points="587,405 648,527 526,527" fill="#1a1a2e" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,542 C360,586 840,498 1200,542 L1200,630 L0,630Z" fill="#1a1a2e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    명동 핫플 추천
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    명동 — 핫플
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#7c3aed" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    명동 명동 핫플 추천 — 핫플
  </text>
</svg>